<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Socket Chat</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section id="auth-view" class="panel auth-panel">
        <div class="brand">
          <div>
            <p class="eyebrow">SOCKET CHAT</p>
            <h1>Welcome back</h1>
          </div>
        </div>
        <p class="intro">Sign in to keep your conversations private, or create an account to get started.</p>
        <div class="auth-tabs" role="tablist" aria-label="Authentication">
          <button class="tab active" type="button" data-mode="login">Log in</button>
          <button class="tab" type="button" data-mode="register">Register</button>
        </div>
        <form id="auth-form">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
          <button class="primary-button" type="submit"><span id="auth-submit-label">Log in</span><span aria-hidden="true">→</span></button>
        </form>
        <p id="auth-status" class="status" role="alert"></p>
      </section>

      <section id="chat-view" class="panel chat-panel hidden">
        <aside class="chat-sidebar">
          <header class="sidebar-header">
            <div class="profile-avatar">Y</div>
            <div class="sidebar-title"><p class="eyebrow">MESSAGES</p><h1>Chats</h1></div>
            <button id="logout-button" class="ghost-button" type="button">Log out</button>
          </header>
          <label class="search-label" for="user-search">Search chats</label>
          <input id="user-search" class="search-input" placeholder="Search users..." autocomplete="off">
          <ul id="chat-list" class="chat-list" aria-label="Your chats"></ul>
        </aside>
        <section class="conversation">
          <header class="chat-header">
            <div class="conversation-heading">
              <div id="active-avatar" class="profile-avatar">?</div>
              <div><p class="eyebrow">PRIVATE CHAT</p><h1 id="active-user">Select a chat</h1></div>
            </div>
            <span id="connection-status" class="connection"><span class="status-dot"></span>Connecting</span>
          </header>
          <div id="messages" class="messages" aria-live="polite">
            <div id="empty-state" class="empty-state">
              <strong>Choose a chat to start messaging</strong>
              <span>Your conversations are saved securely.</span>
            </div>
          </div>
        </section>
        <form id="message-form" class="composer">
          <label class="visually-hidden" for="message-input">Message</label>
          <input id="message-input" maxlength="2000" placeholder="Select a chat first..." autocomplete="off" disabled required>
          <button class="send-button" type="submit" aria-label="Send message" disabled>↑</button>
        </form>
        <p id="chat-status" class="status" role="alert"></p>
      </section>
    </main>
    <script src="/client.js" defer></script>
  </body>
</html>
